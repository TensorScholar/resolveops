name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,web]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/resolveops
      - run: python scripts/check_architecture.py
      - run: python scripts/secret_scan.py
      - run: python scripts/security_scan.py
      - run: python scripts/generate_schemas.py && git diff --exit-code -- schemas
      - run: >-
          pytest -o addopts='-q --strict-markers' -W error::ResourceWarning
          --cov=resolveops --cov-branch --cov-report=xml
      - run: python -m resolveops demo
      - run: python -m pip_audit
