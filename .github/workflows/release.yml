name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade pip "setuptools>=83" wheel
      - run: python -m pip install -e '.[dev,web]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/resolveops
      - run: python scripts/check_architecture.py
      - run: python scripts/secret_scan.py
      - run: python scripts/security_scan.py
      - run: python scripts/generate_schemas.py && git diff --exit-code -- schemas
      - run: >-
          pytest -o addopts='-q --strict-markers' -W error::ResourceWarning
          --cov=resolveops --cov-branch
      - run: python -m resolveops demo
      - run: python -m pip_audit
      - run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
